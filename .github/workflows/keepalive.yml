name: keepalive

# Render free instances spin down after ~15 min without inbound traffic, which
# adds a 50s+ cold start to the next request. Ping /health every 5 minutes so
# the demo stays warm. Fails loudly on a non-200 so gaps show in the run history.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Pricewise /health
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 https://pricewise-1cpo.onrender.com/health)
          echo "HTTP $code: $(cat /tmp/health.json)"
          test "$code" = "200"
